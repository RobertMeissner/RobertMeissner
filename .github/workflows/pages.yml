name: Deploy Pages (docs hub + Quartz 5 blog)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "blog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install blog dependencies and plugins
        run: |
          cd blog
          npm ci
          npx quartz plugin install

      - name: Build Quartz blog
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          cd blog
          npx quartz build --output "$GITHUB_WORKSPACE/site/blog"

      - name: Add static hub
        run: cp -r docs/. "$GITHUB_WORKSPACE/site/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "$GITHUB_WORKSPACE/site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
